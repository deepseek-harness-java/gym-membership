<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 健身房会籍管家台 · Gym Membership</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f1f5f4; color:#1a2b28; }
  header { background:linear-gradient(135deg,#0e4d45,#2e8b6f); color:#fff; padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; }
  header .sub { font-size:12px; opacity:.85; margin-top:4px; }
  header .badge { font-size:13px; background:rgba(255,255,255,.15); padding:6px 14px; border-radius:20px; }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px 20px; max-width:1240px; margin:0 auto; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .card { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(14,77,69,.08); }
  .card h2 { font-size:15px; margin-bottom:12px; color:#0e4d45; }
  .stat { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .stat div { background:#e2f0ec; border-radius:10px; padding:12px; }
  .stat b { display:block; font-size:22px; color:#0e6b5c; margin-top:4px; }
  .stat span { font-size:12px; color:#6b8a82; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; }
  .tag.g { background:#e3f4e9; color:#218a58; }
  .tag.y { background:#fdf3e0; color:#c07f16; }
  .tag.r { background:#fdeaea; color:#c74a44; }
  .tag.b { background:#e7f0fb; color:#2e5fa3; }
  .it { border:1px solid #d5e5e0; border-radius:10px; padding:10px 14px; margin-bottom:10px; }
  .it .top { display:flex; justify-content:space-between; margin-bottom:4px; }
  .it b { color:#0e4d45; font-size:13.5px; }
  .it .meta { font-size:12.5px; color:#54706a; line-height:1.7; }
  .ai-panel { position:sticky; top:16px; display:flex; flex-direction:column; height:calc(100vh - 32px); background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(14,77,69,.08); }
  .ai-head { background:linear-gradient(135deg,#0e4d45,#2e8b6f); color:#fff; padding:14px 16px; }
  .ai-head b { font-size:15px; }
  .ai-head .sub { font-size:11px; opacity:.85; margin-top:3px; }
  .ai-body { flex:1; overflow-y:auto; padding:14px; font-size:13.5px; line-height:1.75; }
  .ai-body .msg { margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .ai-body .msg.user { background:#e2f0ec; border-radius:10px 10px 2px 10px; padding:8px 12px; margin-left:24px; color:#1a2b28; }
  .chips { padding:8px 14px; display:flex; flex-wrap:wrap; gap:6px; border-top:1px solid #dfeee9; }
  .chip { font-size:12px; background:#e2f0ec; color:#0e4d45; border:none; border-radius:14px; padding:5px 10px; cursor:pointer; }
  .chip:hover { background:#cfe6df; }
  .ai-input { display:flex; gap:8px; padding:10px 14px; border-top:1px solid #dfeee9; }
  .ai-input input { flex:1; border:1px solid #bcd6cf; border-radius:8px; padding:9px 12px; font-size:13px; outline:none; }
  .ai-input input:focus { border-color:#2e8b6f; }
  .ai-input button { background:#2e8b6f; color:#fff; border:none; border-radius:8px; padding:0 18px; font-size:13px; cursor:pointer; }
  .ai-input button:disabled { background:#7db8a6; }
</style>
</head>
<body>
<header>
  <div>
    <h1>💪 AI 健身房会籍管家台</h1>
    <div class="sub">卡种 · 团课 · 办卡 · 会籍 | 连锁健身云平台</div>
  </div>
  <div class="badge" id="topBadge">加载中…</div>
</header>
<main>
  <div class="col">
    <div class="card">
      <h2>运营看板</h2>
      <div class="stat" id="stats"></div>
    </div>
    <div class="card">
      <h2>会员卡种</h2>
      <div id="plans"></div>
    </div>
    <div class="card">
      <h2>最新会员与预约</h2>
      <div id="recent"></div>
    </div>
  </div>
  <div class="ai-panel">
    <div class="ai-head">
      <b>💪 AI 健身房会籍管家</b>
      <div class="sub">gym-copilot · 卡种 / 团课 / 办卡 / 会籍</div>
    </div>
    <div class="ai-body" id="aiBody"></div>
    <div class="chips">
      <button class="chip" onclick="ask('你们有什么会员卡种？价格和权益是什么？')">卡种价格</button>
      <button class="chip" onclick="ask('本周有什么团课？还有名额吗？')">本周团课</button>
      <button class="chip" onclick="ask('帮我办一张季卡，姓名李小红')">办卡入会</button>
      <button class="chip" onclick="ask('查一下会员 M5001 的会籍状态')">会籍查询</button>
      <button class="chip" onclick="ask('今天运营情况怎么样？')">运营看板</button>
    </div>
    <div class="ai-input">
      <input id="q" placeholder="例如：年卡多少钱？；帮我预约周六 10:00 杠铃塑形" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</main>
<script>
const j = r => Promise.resolve(r).then(resp => resp.json()).then(d => d.data ?? d);
async function load() {
  try {
    const st = await j(fetch('/api/stats'));
    document.getElementById('topBadge').textContent = `会员 ${st.totalMembers} · 活跃会籍 ¥${st.activeRevenue}`;
    document.getElementById('stats').innerHTML = `
      <div><span>会员总数</span><b>${st.totalMembers}</b></div>
      <div><span>有效会籍</span><b>${st.valid}</b></div>
      <div><span>团课预约</span><b>${st.bookings}</b></div>
      <div><span>活跃收入</span><b>¥${st.activeRevenue}</b></div>`;
    const ps = await j(fetch('/api/plans'));
    document.getElementById('plans').innerHTML = (ps.plans || ps).map(p => `
      <div class="it">
        <div class="top"><b>${p.name}</b><span class="tag g">¥${p.price}</span></div>
        <div class="meta">${p.months} 个月 · ${p.benefits}</div>
      </div>`).join('');
    document.getElementById('recent').innerHTML = `
      <div class="it">
        <div class="top"><b>M5004 · 王小明</b><span class="tag g">有效</span></div>
        <div class="meta">月卡 · ¥399 · 2026-09-25 ~ 2026-10-24</div>
      </div>
      <div class="it">
        <div class="top"><b>B7003 · 王小明</b><span class="tag b">已预约</span></div>
        <div class="meta">周三 19:00 燃脂搏击操 · T03 吴教练</div>
      </div>
      <div class="it">
        <div class="top"><b>M5002 · 孙先生</b><span class="tag g">有效</span></div>
        <div class="meta">月卡 · 2026-09-01 ~ 2026-09-30</div>
      </div>`;
  } catch(e) { console.error(e); }
}
function ask(t) { const q=document.getElementById('q'); q.value=t; send(); }
async function send() {
  const inp = document.getElementById('q'), btn = document.getElementById('sendBtn');
  const text = inp.value.trim(); if (!text || btn.disabled) return;
  inp.value = ''; btn.disabled = true;
  const body = document.getElementById('aiBody');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text; body.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg'; a.textContent = '…'; body.appendChild(a);
  try {
    const resp = await fetch('/api/assistant/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', out = '';
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        for (const line of p.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const dstr = line.slice(5).trim(); if (!dstr || dstr === '[DONE]') continue;
          try {
            const d = JSON.parse(dstr);
            const piece = d.content ?? d.delta ?? '';
            if (typeof piece === 'string' && piece) { out += piece; a.textContent = out; body.scrollTop = body.scrollHeight; }
          } catch(e) {}
        }
      }
    }
    if (!out) a.textContent = '（无返回内容）';
  } catch(e) { a.textContent = 'AI 服务暂时不可用：' + e.message; }
  btn.disabled = false; body.scrollTop = body.scrollHeight;
}
load();
</script>
</body>
</html>
